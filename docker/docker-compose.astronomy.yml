version: '3.8'

services:
  cosmic-horizons-casa:
    image: casapy/casa:latest
    container_name: cosmic-horizons-casa
    volumes:
      - ./astronomy-data:/data
    # CASA often needs specific env vars or entrypoint; we rely on the
    # adapter/worker to run commands inside it or launch its own container.
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

  # legacy Node worker (optional).  The new `astro-service` is preferred.
  cosmic-horizons-worker:
    build:
      context: ./apps/cosmic-horizons-api
      dockerfile: Dockerfile # reuse API Dockerfile if available
      target: worker
    container_name: cosmic-horizons-worker
    environment:
      - REDIS_URL=redis://cosmic-horizons-redis:6379
      - ASTRO_DATA_DIR=/data
      - NODE_ENV=development
    volumes:
      - ./astronomy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - cosmic-horizons-redis
      - cosmic-horizons-casa
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

  # new Python-based astronomy microservice (renamed to avoid confusion with Nest API)
  cosmic-horizon-data:
    build:
      context: ./apps/cosmic-horizons-api
      dockerfile: docker/astronomy-worker.Dockerfile
    container_name: cosmic-horizon-data
    environment:
      - REDIS_URL=redis://cosmic-horizons-redis:6379
      - ASTRO_DATA_DIR=/data
      - CASA_QUEUE_NAME=casa:queue
    volumes:
      - ./astronomy-data:/data
    depends_on:
      - cosmic-horizons-redis
      - cosmic-horizons-casa
    ports:
      - "8080:8080"
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

networks:
  cosmic-horizons-network:
    external: true
