version: '3.8'

services:
  cosmic-horizons-casa:
    profiles: ['astro']
    # use publicly available CASA6 build from RXASTRO instead of the
    # proprietary casapy/casa image that requires login.  see:
    # https://hub.docker.com/r/rxastro/casa6
    image: rxastro/casa6:latest
    container_name: cosmic-horizons-casa
    ports:
      - "8080:8080"   # expose web GUI if needed
      - "8081:8081"
    volumes:
      - ./astronomy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # the upstream image has no CMD/ENTRYPOINT, so supply a harmless
    # command to keep the container alive; real CASA calls will exec
    # into it using `docker exec`.
    command: ["tail", "-f", "/dev/null"]
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

  # legacy Node worker (optional).  The new `astro-service` is preferred.
  cosmic-horizons-worker:
    profiles: ['astro-data']
    build:
      context: ./apps/cosmic-horizons-api
      dockerfile: Dockerfile # reuse API Dockerfile if available
      target: worker
    container_name: cosmic-horizons-worker
    environment:
      - REDIS_URL=redis://cosmic-horizons-redis:6379
      - ASTRO_DATA_DIR=/data
      - NODE_ENV=development
    volumes:
      - ./astronomy-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - cosmic-horizons-redis
      - cosmic-horizons-casa
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

  # CASA-adjacent Python astronomy microservice
  cosmic-horizons-casa-data:
    profiles: ['astro-data']
    build:
      context: ./apps/cosmic-horizons-api
      dockerfile: docker/astronomy-worker.Dockerfile
    container_name: cosmic-horizons-casa-data
    environment:
      - REDIS_URL=redis://cosmic-horizons-redis:6379
      - ASTRO_DATA_DIR=/data
      - CASA_QUEUE_NAME=casa:queue
    volumes:
      - ./astronomy-data:/data
    depends_on:
      - cosmic-horizons-redis
      - cosmic-horizons-casa
    ports:
      - "8090:8080"
    networks:
      - cosmic-horizons-network
    restart: unless-stopped

networks:
  cosmic-horizons-network:
    external: true
