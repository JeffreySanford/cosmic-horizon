name: Local LLM CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  llm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install
      - name: Start local compute & Ollama
        run: |
          # use existing helper scripts to pull and verify the LLM service
          pnpm run llm:pull || true
          # this script exits 0 only when Ollama is reachable
          pnpm run llm:smoke
      - name: Start API service for e2e
        run: |
          # serve-e2e runs in continuous mode; let it boot in background
          pnpm nx run cosmic-horizons-api:serve-e2e &
          # give the service a moment to warm up (health-check in Playwright will
          # poll but we add a short delay to avoid racing conditions)
          sleep 5
      - name: Run LLM job-flow tests
        run: pnpm nx run cosmic-horizons-web-e2e:e2e --grep llm
      - name: Secret scan
        run: pnpm run scan-secrets || true
