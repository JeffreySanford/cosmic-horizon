name: Local LLM CI

on:
  workflow_dispatch:
# disable automatic runs; this workflow is heavy and should be triggered manually only
#  push:
#    branches: [main, develop]
#  pull_request:

jobs:
  llm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start infra
        run: pnpm run start:infra:ci
      - name: Start Ollama
        run: docker compose -f docker-compose.yml -f docker-compose.events.yml --profile llm up -d --wait cosmic-horizons-ollama
      - name: Start local compute & Ollama
        run: |
          # use existing helper scripts to pull and verify the LLM service
          pnpm run llm:pull || true
          # this script exits 0 only when Ollama is reachable
          pnpm run llm:smoke
      - name: Start API service for e2e
        run: |
          # serve-e2e runs in continuous mode; let it boot in background
          pnpm nx run cosmic-horizons-api:serve-e2e &
          # give the service a moment to warm up (health-check in Playwright will
          # poll but we add a short delay to avoid racing conditions)
          sleep 5
      - name: Run LLM job-flow tests
        run: pnpm nx run cosmic-horizons-web-e2e:e2e --grep llm
      - name: Secret scan
        run: pnpm run scan-secrets || true
      - name: Stop infra
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.events.yml down --remove-orphans --volumes
