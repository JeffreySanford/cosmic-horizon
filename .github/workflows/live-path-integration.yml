name: Live Path Integration

on: [push, pull_request]

jobs:
  mock-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # disable custom redis flags; they were causing docker errors
        #options: >-
        #  --save 60 1
        #  --appendonly no
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start mock Tapis server
        run: node tools/mock-tapis-server.js &
      - name: Run adapter live-mode smoke
        env:
          TACC_LIVE: 'true'
          TACC_TENANT_BASE_URL: 'http://localhost:4000'
          TACC_ACCESS_TOKEN: 'dummy'
        # invoke the specific project directly and pass the pattern after -- so Nx forwards it to Jest/Vitest
        run: pnpm nx run cosmic-horizons-api:test -- --testPathPatterns=jobs/tacc-integration.adapter.spec.ts
