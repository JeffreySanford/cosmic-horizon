<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cosmic Horizon</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://aladin.cds.unistra.fr" crossorigin />
    <link rel="dns-prefetch" href="https://aladin.cds.unistra.fr" />
    <link rel="preconnect" href="https://skies.esac.esa.int" crossorigin />
    <link rel="dns-prefetch" href="https://skies.esac.esa.int" />
    <link rel="preconnect" href="https://alasky.cds.unistra.fr" crossorigin />
    <link rel="dns-prefetch" href="https://alasky.cds.unistra.fr" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      /**
       * Global shim to address non-passive event listener violations from third-party libraries.
       * NOTE: only force `wheel` to be passive by default — leaving touch events untouched
       * because some libraries (Aladin) rely on calling preventDefault() from touch handlers.
       */
      (function () {
        var originalAddEventListener = EventTarget.prototype.addEventListener;
        EventTarget.prototype.addEventListener = function (
          type,
          listener,
          options,
        ) {
          // make wheel and touch actions passive to quiet Chrome warnings; we
          // additionally wrap touch handlers so that calls to preventDefault()
          // won't trigger "Unable to preventDefault inside passive event listener"
          // messages.  As long as the page can tolerate a bit of scrolling when
          // Aladin drags, this trade‑off is acceptable compared to the endless
          // console noise we were seeing.
          var passiveEvents = ['wheel', 'touchstart', 'touchmove'];
          if (passiveEvents.indexOf(type) !== -1) {
            // for elements inside the aladin host we want to preserve the
            // original passive setting so that the viewer can zoom via wheel
            // instead of scrolling the page.  Aladin registers its own wheel
            // handler on the host element and expects to be able to call
            // preventDefault(); if we force passive there the event cannot be
            // cancelled and the page scrolls instead.
            const isAladinHost =
              this instanceof HTMLElement &&
              this.classList.contains('aladin-host');

            if (!isAladinHost) {
              if (typeof options === 'boolean') {
                options = { capture: options, passive: true };
              } else if (typeof options === 'object') {
                if (options.passive === undefined) {
                  options.passive = true;
                }
              } else if (options === undefined) {
                options = { passive: true };
              }
            }

            // if we are adding a passive touch listener, wrap the callback
            // so that its event.preventDefault is a no-op.  This prevents
            // runtime complaints when libraries still attempt to cancel the
            // default behavior.
            if (passiveEvents.slice(1).includes(type) && options.passive) {
              const originalListener = listener;
              listener = function (event) {
                const orig = event.preventDefault;
                event.preventDefault = () => {};
                try {
                  return originalListener.call(this, event);
                } finally {
                  event.preventDefault = orig;
                }
              };
            }
          }
          return originalAddEventListener.call(this, type, listener, options);
        };
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
